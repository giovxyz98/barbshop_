<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="brand.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono&family=Montserrat:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="hero">
        <div class="overlay">
            <img data-brand-logo class="logo" alt="">
            <p data-brand="completo"></p>
        </div>
    </header>
    <main>
        <div class="booking">
            <p>Prenota qui il tuo servizio</p>
            <button onclick="changePage('prenota')" class="btn">Prenota</button>
        </div>
        <h2>Orari del salone</h2>
        <div class="hours">
            <div id="giorni" class="schedule">
                <div class="day open">
                    <p>Martedì</p>
                    <small>05/03/2024</small>
                    <div class="orari">
                        <div class="mattino">
                            <span>Mattino:</span>
                            09:00 - 13:00
                        </div>
                        <div class="pomeriggio">
                            <span>Pomeriggio:</span>
                            15:00 - 20:00
                        </div>
                    </div>
                </div>
                <div class="day closed">
                    <p>Lunedì</p>
                    <small>04/03/2024</small>
                    <div class="orari">
                        Chiuso
                    </div>
                </div>


            </div>
        </div>
        </div>
        <h2>Servizi</h2>
        <div class="services">
            <div class="service">
                <p>Taglio</p>
                <span>€ 10,00</span>
            </div>
            <div class="service">
                <p>Barba</p>
                <span>€ 5,00</span>
            </div>
            <div class="service">
                <p>Sopracciglia</p>
                <span>€ 3,00</span>
            </div>
            <div class="service">
                <p>Completo</p>
                <span>€ 18,00</span>
            </div>


    </main>

    <nav class="bottom-nav">
        <a id="home" class="active"><i class="fa fa-home"></i><span>Home</span></a>
        <a id="prenota" onclick="changePage('prenota')"><i class="fa fa-calendar"></i><span>Prenota</span></a>
        <a id="shop" onclick="changePage('shop')"><i class="fa fa-store"></i><span>Shop</span></a>
        <a id="profilo" onclick="changePage('profilo')"><i class="fa fa-user"></i><span>Profilo</span></a>
    </nav>

    <script>
        const API = 'http://localhost:3000/api';
        const NOMI_GIORNO = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

        function changePage(id) {
            window.location.href = id + ".html";
        }

        function isoLocale(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // Orari dei prossimi 7 giorni dal calendario del salone: una riga per fascia, "Chiuso" se non si lavora.
        async function fetchGiorni() {
            try {
                const da = new Date();
                const a = new Date();
                a.setDate(a.getDate() + 6);
                const response = await fetch(`${API}/calendario?da=${isoLocale(da)}&a=${isoLocale(a)}`);
                const { giorni } = await response.json();

                const container = document.getElementById('giorni');
                container.innerHTML = '';
                giorni.forEach(giorno => {
                    const [y, m, d] = giorno.data.split('-');
                    const div = document.createElement('div');
                    div.classList.add('day', giorno.aperto ? 'open' : 'closed');
                    const orari = giorno.aperto
                        ? giorno.fasce.map(f => `<span>${f.apertura} - ${f.chiusura}</span>`).join('')
                        : 'Chiuso';
                    div.innerHTML = `
                        <p>${NOMI_GIORNO[giorno.giorno_settimana]}</p>
                        <small>${d}/${m}/${y}</small>
                        <div class="orari">${orari}</div>`;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error("Errore nel recupero degli orari:", error);
            }
        }

        fetchGiorni();
    </script>


</body>

</html>

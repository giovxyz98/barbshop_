<!DOCTYPE html>
<html lang="it" data-titolo="Home">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="brand.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono&family=Montserrat:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header"></div>
    <main class="page">
        <h1 id="saluto"></h1>

        <div class="section-title">
            <h2>Le tue prenotazioni</h2>
            <a href="prenota.html" class="btn btn-small">Prenota</a>
        </div>
        <div id="prenotazioni" class="stack"></div>

        <h2>Servizi</h2>
        <div id="servizi" class="quick"></div>

        <h2>Orari del salone</h2>
        <div id="giorni" class="hours"></div>
    </main>
    <nav id="nav"></nav>

    <script src="app.js"></script>
    <script>
        const user = initPage('cliente', 'home');

        function caricaSaluto() {
            $('#saluto').textContent = `Ciao ${user.nome || user.username}`;
        }

        // Prenotazioni confermate che non sono ancora finite.
        async function caricaPrenotazioni() {
            const box = $('#prenotazioni');
            box.innerHTML = loadingHtml();
            const r = await api('GET', `/prenotazioni?username=${encodeURIComponent(user.username)}&da=${todayISO()}&stato=confermata`);
            if (!r.ok) { box.innerHTML = emptyHtml('fa-triangle-exclamation', r.error); return; }
            const oggi = todayISO(), adesso = nowMin();
            const attive = r.data.prenotazioni.filter(p => p.data > oggi || toMin(p.fine) > adesso);
            if (!attive.length) {
                box.innerHTML = emptyHtml('fa-calendar', 'Non hai prenotazioni attive. Prenota il tuo prossimo appuntamento!');
                return;
            }
            box.innerHTML = attive.map(p => `
                <div class="item">
                    <div class="when">${esc(fmtDataBreve(p.data))}<br>${esc(p.inizio)}</div>
                    <div class="main">
                        <div class="title">${esc(p.servizio.nome)}</div>
                        <div class="sub">${esc(p.inizio)} – ${esc(p.fine)} · <span class="price">${esc(fmtEuro(p.servizio.prezzo))}</span></div>
                    </div>
                    <div class="actions"><button class="btn-danger btn-small" data-annulla="${p.id}">Annulla</button></div>
                </div>`).join('');
        }

        $('#prenotazioni').addEventListener('click', async e => {
            const b = e.target.closest('[data-annulla]');
            if (!b) return;
            const ok = await confirmDialog({ title: 'Annullare la prenotazione?', message: 'Lo slot tornerà disponibile per altri clienti.', confirmText: 'Sì, annulla', cancelText: 'Mantieni', danger: true });
            if (!ok) return;
            const r = await api('DELETE', `/prenotazioni/${b.dataset.annulla}`);
            if (!r.ok) return toast(r.error, 'err');
            toast('Prenotazione annullata');
            caricaPrenotazioni();
        });

        async function caricaServizi() {
            const box = $('#servizi');
            const r = await api('GET', '/getServizi');
            if (!r.ok) { box.innerHTML = emptyHtml('fa-scissors', r.status === 404 ? 'Nessun servizio disponibile' : r.error); return; }
            box.innerHTML = r.data.data.map(s => `
                <a class="card hover" href="prenota.html?servizio=${s.id}">
                    <div class="n">${esc(s.nome)}</div>
                    <div class="price">${esc(fmtEuro(s.prezzo))}</div>
                    <div class="d">${esc(s.durata)} min</div>
                </a>`).join('');
        }

        // Orari dei prossimi 7 giorni dal calendario del salone.
        async function caricaOrari() {
            const box = $('#giorni');
            const da = todayISO();
            const r = await api('GET', `/calendario?da=${da}&a=${addDaysISO(da, 6)}`);
            if (!r.ok) { box.innerHTML = emptyHtml('fa-clock', r.error); return; }
            box.innerHTML = r.data.giorni.map(g => {
                const [y, m, d] = g.data.split('-');
                const orari = g.aperto ? g.fasce.map(f => `<span>${esc(f.apertura)} – ${esc(f.chiusura)}</span>`).join('') : 'Chiuso';
                const classi = `day ${g.aperto ? 'open' : 'closed'} ${g.data === da ? 'today' : ''}`;
                const corpo = `
                    <p>${esc(NOMI_GIORNO[g.giorno_settimana])}</p>
                    <small>${d}/${m}</small>
                    <div class="orari">${orari}</div>`;
                // i giorni aperti portano alla prenotazione con il giorno già scelto
                return g.aperto
                    ? `<a class="${classi}" href="prenota.html?data=${g.data}" aria-label="Prenota ${esc(NOMI_GIORNO[g.giorno_settimana])} ${d}/${m}">${corpo}</a>`
                    : `<div class="${classi}">${corpo}</div>`;
            }).join('');
        }

        if (user) {
            caricaSaluto();
            caricaPrenotazioni();
            caricaServizi();
            caricaOrari();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="it" data-titolo="Accedi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="brand.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono&family=Montserrat:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header"></div>
    <main class="page narrow">
        <h1 data-brand="benvenuto"></h1>
        <p class="center muted">Accedi per prenotare o gestire il tuo salone.</p>

        <form id="loginForm" class="card" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" placeholder="Il tuo username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="La tua password">
            </div>
            <div id="errorMessage" class="form-error" role="alert"></div>
            <button type="submit" class="block" id="submitBtn">Accedi</button>
        </form>

        <p class="center" style="margin-top:18px">Non hai un account? <a href="registrati.html">Richiedi la registrazione</a></p>

        <p class="center muted" style="font-size:.78rem; margin-top:22px">
            <span class="badge">Accesso di prova</span><br>
            Per ora funziona con qualsiasi credenziale. Uno username che inizia per <span class="mono">admin</span> entra nell'area del salone, gli altri come cliente.
        </p>
    </main>

    <script src="app.js"></script>
    <script>
        renderHeader(null);

        const existing = session();
        if (existing) location.replace(existing.ruolo === 'admin' ? 'admin.html' : 'home.html');

        $('#loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = $('#submitBtn');
            const err = $('#errorMessage');
            err.textContent = '';
            btn.disabled = true;
            const r = await api('POST', '/login', { username: $('#username').value.trim(), password: $('#password').value });
            btn.disabled = false;
            if (!r.ok) { err.textContent = r.error; return; }
            setSession(r.data.user);
            location.href = r.data.user.ruolo === 'admin' ? 'admin.html' : 'home.html';
        });
    </script>
</body>

</html>

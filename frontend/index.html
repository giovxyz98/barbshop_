<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="brand.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono&family=Montserrat:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="hero">
        <div class="overlay">
            <img data-brand-logo class="logo" alt="">
            <p data-brand="completo"></p>
        </div>
    </header>
    <h1 data-brand="benvenuto"></h1>
    <h1>Effettua qui il tuo accesso</h1>
    <form id="loginForm">
        <input type="text" name="username" id="username" placeholder="Username" required>
        <input type="password" name="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn">Accedi</button>
    </form>
    
    <p id="errorMessage" style="color: red; display: none;">Credenziali errate</p>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
    
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
    
            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
    
            if (response.ok) {
                const { user } = await response.json();
                try { sessionStorage.setItem('user', JSON.stringify(user)); } catch (e) {}
                // login fittizio: "admin..." va all'area admin, gli altri alla home cliente
                window.location.href = user.ruolo === 'admin' ? "admin.html" : "home.html";
            } else {
                document.getElementById('errorMessage').style.display = "block";
            }
        });
    </script>
    
</body>
</html>
